<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Packaging Bag Body -->
  <polygon points="260,140 540,140 570,480 230,480" fill="url(#bagGrad)" stroke="#10b981" stroke-width="6" />

  <!-- Sealed Top Fold Header -->
  <rect x="240" y="110" width="320" height="40" rx="6" fill="#047857" stroke="#065f46" stroke-width="2" />
  <line x1="250" y1="130" x2="550" y2="130" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Front Product Label Graphic Shield -->
  <rect x="280" y="180" width="240" height="260" rx="20" fill="url(#greenGrad)" />
  
  <!-- Bio Shield Icon -->
  <path d="M 400 210 Q 450 210, 450 250 Q 450 310, 400 340 Q 350 310, 350 250 Q 350 210, 400 210 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 400 230 L 415 260 L 385 260 Z" fill="#047857" />
  <circle cx="400" cy="285" r="12" fill="#047857" />

  <!-- Product Name & Spec -->
  <text x="400" y="365" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">TRICHODERMA VIRIDE</text>
  <text x="400" y="390" font-family="Outfit, Arial, sans-serif" font-weight="bold" font-size="14" fill="#a7f3d0" text-anchor="middle">ORGANIC BIO-FUNGICIDE</text>
  <text x="400" y="420" font-family="monospace" font-weight="black" font-size="20" fill="#fde047" text-anchor="middle">NET WT: 10 KG</text>

  <!-- Eco Leaf Emblem -->
  <circle cx="280" cy="460" r="24" fill="#10b981" />
  <path d="M 270 460 Q 280 445, 290 460 Q 280 475, 270 460 Z" fill="#ffffff" />

  <!-- Label Badge -->
  <rect x="180" y="520" width="440" height="48" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="550" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">BIO-FUNGICIDE TRICHODERMA VIRIDE (10KG)</text>
</svg>

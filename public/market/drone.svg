<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="droneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="beamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Crop Field Ground Below -->
  <path d="M 0 440 Q 400 420, 800 440 L 800 600 L 0 600 Z" fill="#15803d" />

  <!-- Scanning Laser Beam -->
  <polygon points="400,240 180,450 620,450" fill="#22c55e" opacity="0.25" filter="url(#beamGlow)" />
  <line x1="400" y1="240" x2="180" y2="450" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="400" y1="240" x2="620" y2="450" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Drone Body Center Quadcopter Frame -->
  <ellipse cx="400" cy="220" rx="60" ry="24" fill="url(#droneGrad)" stroke="#38bdf8" stroke-width="4" />
  <circle cx="400" cy="220" r="14" fill="#0f172a" />

  <!-- Drone Quad Arms -->
  <line x1="400" y1="220" x2="240" y2="160" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="400" y1="220" x2="560" y2="160" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="400" y1="220" x2="260" y2="280" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="400" y1="220" x2="540" y2="280" stroke="#334155" stroke-width="12" stroke-linecap="round" />

  <!-- Rotors & Spin Blades -->
  <!-- Top Left Rotor -->
  <circle cx="240" cy="160" r="16" fill="#0f172a" />
  <ellipse cx="240" cy="160" rx="55" ry="10" fill="#38bdf8" opacity="0.5" />

  <!-- Top Right Rotor -->
  <circle cx="560" cy="160" r="16" fill="#0f172a" />
  <ellipse cx="560" cy="160" rx="55" ry="10" fill="#38bdf8" opacity="0.5" />

  <!-- Bottom Left Rotor -->
  <circle cx="260" cy="280" r="16" fill="#0f172a" />
  <ellipse cx="260" cy="280" rx="55" ry="10" fill="#38bdf8" opacity="0.5" />

  <!-- Bottom Right Rotor -->
  <circle cx="540" cy="280" r="16" fill="#0f172a" />
  <ellipse cx="540" cy="280" rx="55" ry="10" fill="#38bdf8" opacity="0.5" />

  <!-- Multispectral Camera Gimbal Lens -->
  <rect x="385" y="240" width="30" height="24" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
  <circle cx="400" cy="252" r="6" fill="#22c55e" />

  <!-- Label Badge -->
  <rect x="120" y="520" width="560" height="48" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="550" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUTONOMOUS MULTISPECTRAL CROP SCANNER DRONE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="chamberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Ground Line -->
  <rect x="0" y="450" width="800" height="150" fill="#1e293b" />

  <!-- Solar Roof Panel Array -->
  <polygon points="180,140 620,140 680,200 120,200" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="4" />
  <line x1="280" y1="140" x2="260" y2="200" stroke="#38bdf8" stroke-width="2" />
  <line x1="380" y1="140" x2="380" y2="200" stroke="#38bdf8" stroke-width="2" />
  <line x1="480" y1="140" x2="500" y2="200" stroke="#38bdf8" stroke-width="2" />
  <line x1="150" y1="170" x2="650" y2="170" stroke="#38bdf8" stroke-width="2" />

  <!-- Main Insulated Walk-In Cold Room Chamber Body -->
  <rect x="160" y="200" width="480" height="250" rx="16" fill="url(#chamberGrad)" stroke="#94a3b8" stroke-width="6" />

  <!-- Heavy Cold Room Door -->
  <rect x="200" y="230" width="160" height="220" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="4" />
  <rect x="330" y="320" width="18" height="40" rx="4" fill="#0f172a" /> <!-- Handle -->
  
  <!-- Digital Temperature Controller -->
  <rect x="420" y="240" width="180" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="510" y="265" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="2">TEMP CONTROL</text>
  <text x="510" y="295" font-family="monospace" font-weight="bold" font-size="24" fill="#06b6d4" text-anchor="middle" filter="url(#glow)">-4.0°C</text>

  <!-- Ventilation Compressor Grille -->
  <rect x="420" y="330" width="180" height="100" rx="8" fill="#334155" />
  <line x1="440" y1="350" x2="580" y2="350" stroke="#94a3b8" stroke-width="4" />
  <line x1="440" y1="370" x2="580" y2="370" stroke="#94a3b8" stroke-width="4" />
  <line x1="440" y1="390" x2="580" y2="390" stroke="#94a3b8" stroke-width="4" />
  <line x1="440" y1="410" x2="580" y2="410" stroke="#94a3b8" stroke-width="4" />

  <!-- Snow/Frost Flake Icon -->
  <circle cx="510" cy="380" r="28" fill="#38bdf8" opacity="0.2" />

  <!-- Label Badge -->
  <rect x="150" y="520" width="500" height="48" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="550" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">SOLAR POWERED COLD STORAGE CHAMBER (2 TONNE)</text>
</svg>

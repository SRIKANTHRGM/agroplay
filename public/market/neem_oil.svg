<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Can/Jug Body (5 Litre Jug Container) -->
  <rect x="270" y="160" width="260" height="300" rx="24" fill="url(#bottleGrad)" stroke="#f59e0b" stroke-width="4" />
  
  <!-- Jug Handle -->
  <path d="M 270 200 C 200 200, 200 340, 270 340" fill="none" stroke="url(#bottleGrad)" stroke-width="28" stroke-linecap="round" />

  <!-- Screw Cap -->
  <rect x="370" y="110" width="60" height="50" rx="8" fill="#15803d" stroke="#166534" stroke-width="3" />
  <line x1="370" y1="125" x2="430" y2="125" stroke="#4ade80" stroke-width="2" />
  <line x1="370" y1="140" x2="430" y2="140" stroke="#4ade80" stroke-width="2" />

  <!-- Transparent Gauge Stripe -->
  <rect x="500" y="200" width="12" height="220" rx="6" fill="#fef3c7" opacity="0.8" />
  <line x1="495" y1="240" x2="515" y2="240" stroke="#78350f" stroke-width="2" />
  <line x1="495" y1="290" x2="515" y2="290" stroke="#78350f" stroke-width="2" />
  <line x1="495" y1="340" x2="515" y2="340" stroke="#78350f" stroke-width="2" />
  <line x1="495" y1="390" x2="515" y2="390" stroke="#78350f" stroke-width="2" />

  <!-- Front Printed Label -->
  <rect x="300" y="220" width="180" height="200" rx="16" fill="#fefce8" stroke="#15803d" stroke-width="3" />
  
  <!-- Neem Leaf Graphic -->
  <path d="M 390 240 Q 420 250, 410 280 Q 380 290, 390 240 Z" fill="#15803d" />
  <path d="M 390 240 Q 360 250, 370 280 Q 400 290, 390 240 Z" fill="#22c55e" />

  <text x="390" y="315" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#166534" text-anchor="middle">PURE NEEM OIL</text>
  <text x="390" y="338" font-family="Outfit, Arial, sans-serif" font-weight="bold" font-size="11" fill="#854d0e" text-anchor="middle">10,000 PPM AZADIRACHTIN</text>
  <text x="390" y="360" font-family="Outfit, Arial, sans-serif" font-weight="bold" font-size="10" fill="#15803d" text-anchor="middle">100% COLD PRESSED</text>
  
  <rect x="340" y="375" width="100" height="28" rx="8" fill="#15803d" />
  <text x="390" y="394" font-family="monospace" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">5 LITRES</text>

  <!-- Label Badge -->
  <rect x="160" y="520" width="480" height="48" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="550" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">COLD-PRESSED NEEM OIL BIO-PESTICIDE (5L)</text>
</svg>

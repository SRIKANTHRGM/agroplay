<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Soil Ground -->
  <path d="M 0 450 Q 250 430, 500 450 T 800 440 L 800 600 L 0 600 Z" fill="#451a03" />

  <!-- Power Tiller Body -->
  <!-- Engine Block -->
  <rect x="260" y="240" width="180" height="140" rx="16" fill="url(#metalGrad)" stroke="#7f1d1d" stroke-width="4" />
  <rect x="280" y="220" width="140" height="30" rx="8" fill="#1e293b" />
  <text x="350" y="240" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="14" fill="#f87171" text-anchor="middle">12 HP DIESEL</text>

  <!-- Exhaust Pipe -->
  <rect x="410" y="160" width="20" height="70" rx="5" fill="url(#steelGrad)" />
  <path d="M 420 160 Q 430 140, 450 140" fill="none" stroke="url(#steelGrad)" stroke-width="12" />

  <!-- Handles -->
  <path d="M 270 280 L 120 180 M 270 300 L 120 200" stroke="url(#steelGrad)" stroke-width="16" stroke-linecap="round" />
  <rect x="90" y="170" width="40" height="18" rx="6" fill="#000000" />
  <rect x="90" y="195" width="40" height="18" rx="6" fill="#000000" />

  <!-- Large Tractor Wheel -->
  <circle cx="350" cy="420" r="85" fill="#0f172a" stroke="#334155" stroke-width="12" />
  <circle cx="350" cy="420" r="55" fill="url(#steelGrad)" />
  <circle cx="350" cy="420" r="25" fill="#0f172a" />
  <!-- Treads -->
  <path d="M 350 335 L 350 355 M 350 485 L 350 505 M 265 420 L 285 420 M 415 420 L 435 420 M 290 360 L 305 375 M 395 465 L 410 480" stroke="#f87171" stroke-width="8" stroke-linecap="round" />

  <!-- Rotavator Tines Unit -->
  <rect x="440" y="340" width="160" height="100" rx="12" fill="#334155" />
  <path d="M 460 440 L 480 480 M 510 440 L 530 480 M 560 440 L 580 480" stroke="url(#steelGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Dust Shield Cover -->
  <path d="M 430 330 Q 520 300, 610 330 L 610 370 L 430 370 Z" fill="#dc2626" />

  <!-- Label Badge -->
  <rect x="200" y="520" width="400" height="48" rx="16" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="550" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">HEAVY-DUTY MULTI-CROP POWER TILLER (12 HP)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Water Surface -->
  <rect x="0" y="300" width="800" height="300" fill="url(#waterGrad)" />

  <!-- Aerator Floats (Yellow HDPE Floats) -->
  <rect x="200" y="270" width="120" height="50" rx="20" fill="#eab308" stroke="#ca8a04" stroke-width="4" />
  <rect x="480" y="270" width="120" height="50" rx="20" fill="#eab308" stroke="#ca8a04" stroke-width="4" />

  <!-- Connecting Frame Shaft -->
  <rect x="260" y="285" width="280" height="20" fill="#475569" />

  <!-- Electric Motor Cover -->
  <rect x="360" y="220" width="80" height="80" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="4" />
  <text x="400" y="265" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle">2 HP</text>

  <!-- Rotating Paddle Wheel (Left) -->
  <circle cx="260" cy="340" r="45" fill="none" stroke="#2563eb" stroke-width="8" stroke-dasharray="16 12" />
  <!-- Rotating Paddle Wheel (Right) -->
  <circle cx="540" cy="340" r="45" fill="none" stroke="#2563eb" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Oxygen Foam Splash Waves -->
  <ellipse cx="260" cy="360" rx="90" ry="30" fill="#ffffff" opacity="0.8" />
  <ellipse cx="540" cy="360" rx="90" ry="30" fill="#ffffff" opacity="0.8" />
  
  <circle cx="220" cy="330" r="8" fill="#ffffff" />
  <circle cx="290" cy="320" r="10" fill="#ffffff" />
  <circle cx="500" cy="320" r="9" fill="#ffffff" />
  <circle cx="570" cy="330" r="12" fill="#ffffff" />

  <!-- Label Badge -->
  <rect x="150" y="520" width="500" height="48" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="550" font-family="Outfit, Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">HIGH-DENSITY AQUACULTURE AERATOR SYSTEM</text>
</svg>
